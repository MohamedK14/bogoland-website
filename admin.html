<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOGOLAND — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="wrap header-inner">
    <div class="logo"><img class="logo-img" src="bogolandLogo.jpeg" alt="BOGOLAND"></div>
    <span class="admin-title">Espace Admin</span>
  </div>
</header>

<section class="admin-section wrap">

  <form id="admin-login-form" class="contact-form">
    <h2 style="text-align:center; margin-bottom:10px;">Connexion</h2>
    <input type="email" id="admin-email" placeholder="E-mail" required>
    <input type="password" id="admin-password" placeholder="Mot de passe" required>
    <button type="submit" class="admin-btn admin-btn-primary" style="align-self:center;">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="1.5" stroke="currentColor" stroke-width="1.8"/><path d="M8 11V8a4 4 0 1 1 8 0v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      Se connecter
    </button>
    <p id="admin-login-error" class="cart-note" style="display:none; color:var(--clay);"></p>
  </form>

  <div id="admin-dashboard" style="display:none;">
    <div class="admin-dashboard-head">
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="categories" type="button">Catégories</button>
        <button class="admin-tab" data-tab="products" type="button">Produits</button>
      </div>
      <button id="admin-logout" class="admin-btn admin-btn-text" type="button">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 5H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3M15 16l4-4m0 0-4-4m4 4H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Déconnexion
      </button>
    </div>

    <div id="admin-tab-categories" class="admin-panel">
      <p class="admin-hint">Activez ou désactivez une catégorie pour la boutique. Le changement est immédiat sur le site.</p>
      <div id="admin-categories-list"></div>
      <p id="admin-error" class="cart-note" style="display:none; color:var(--clay);"></p>
    </div>

    <div id="admin-tab-products" class="admin-panel" style="display:none;">
      <div class="admin-panel-head">
        <p class="admin-hint" style="margin:0;">Ajoutez, modifiez ou supprimez des produits.</p>
        <button id="admin-add-product" class="admin-btn admin-btn-primary" type="button">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Ajouter un produit
        </button>
      </div>
      <div id="admin-products-list"></div>
      <p id="admin-products-error" class="cart-note" style="display:none; color:var(--clay);"></p>
    </div>
  </div>

</section>

<div id="product-modal-overlay" class="admin-modal-overlay" style="display:none;">
  <div class="admin-modal">
    <div class="admin-modal-head">
      <h3 id="product-modal-title">Ajouter un produit</h3>
      <button id="product-modal-close" class="admin-modal-close" type="button" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="product-form" class="contact-form">
      <input type="hidden" id="product-id">
      <div class="form-row">
        <input type="text" id="product-name-fr" placeholder="Nom du produit" required>
        <input type="number" id="product-price" placeholder="Prix (CFA)" min="0" required>
      </div>
      <select id="product-category" required></select>
      <textarea id="product-desc-fr" placeholder="Description" required></textarea>

      <div class="admin-instock-row">
        <span>En stock</span>
        <label class="admin-switch">
          <input type="checkbox" id="product-in-stock" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="admin-images-field">
        <span class="admin-images-label">Images</span>
        <div id="product-images-list" class="admin-images-list"></div>
        <label class="admin-btn admin-btn-ghost admin-upload-btn">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/><circle cx="8.5" cy="10" r="1.5" fill="currentColor"/><path d="M21 16l-5.5-5.5L9 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Ajouter une image
          <input type="file" id="product-image-input" accept="image/*" style="display:none;">
        </label>
        <p id="product-upload-status" class="admin-hint" style="display:none;"></p>
      </div>

      <p id="product-form-error" class="cart-note" style="display:none; color:var(--clay);"></p>
      <div class="admin-modal-actions">
        <button type="button" id="product-form-cancel" class="admin-btn admin-btn-ghost">Annuler</button>
        <button type="submit" class="admin-btn admin-btn-primary">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Enregistrer
        </button>
      </div>
    </form>
  </div>
</div>

<script src="js/admin.js"></script>

</body>
</html>
